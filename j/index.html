<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fönster — inbjudan</title>
<style>body{font-family:-apple-system,Helvetica,Arial,sans-serif;background:#141821;color:#EDE8DE;display:flex;min-height:90vh;align-items:center;justify-content:center;text-align:center;padding:20px}
.card{max-width:420px}h1{font-family:Georgia,serif;font-weight:600}
.code{font-size:38px;letter-spacing:8px;color:#E8A24B;font-family:Georgia,serif;margin:18px 0}
a.btn{display:inline-block;background:#E8A24B;color:#20170B;padding:15px 26px;border-radius:16px;font-weight:700;text-decoration:none;margin-top:10px}
p{color:#9AA3B2}</style></head><body><div class="card">
<h1>Du är inbjuden till Fönster</h1>
<p>Hämta appen, öppna den här länken igen — så kommer du rakt in. Inget konto behövs.</p>
<div class="code" id="code"></div>
<a class="btn" id="store" href="https://apps.apple.com/app/id6807051983">Hämta appen i App Store</a>
<p style="margin-top:14px"><a id="open" href="#" style="color:#EDE8DE">Har du redan appen? Öppna inbjudan</a></p>
<p style="font-size:13px">Om koden behövs i appen: <b id="code2" style="color:#E8A24B"></b></p>
<script>
const code=(location.hash||'').replace('#','').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
document.getElementById('code').textContent=code||'——';
document.getElementById('open').href='fonster://j/'+code;
document.getElementById('code2').textContent=code||'——';
</script></div></body></html>
